baseURL: "https://xiaozb.online/"
title: "小张的 AI 笔记"
description: "记录 AI、LLM、Agent 与个人折腾"
keywords:
  - AI
  - LLM
  - Agent
  - 大模型
author: "小张"
languageCode: "zh-cn"
defaultContentLanguage: "zh-cn"
hasCJKLanguage: true
theme: "PaperMod"

params:
  env: production
  description: "记录 AI、LLM、Agent 与个人折腾"
  author: "小张"
  DateFormat: "2006-01-02"
  defaultTheme: auto
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowReadingTime: true
  ShowWordCount: false
  ShowRssButtonInSectionMenu: true
  ShowPageNums: true
  disableSpecial1stPost: true
  mainSections:
    - posts
  assets:
    favicon: "/favicon.ico"
  homeInfoParams:
    Title: "你好，我是小张 👋"
    Content: |
      这里是我的 AI 技术笔记。

      记录大模型、Agent、自动化工具，以及每一次真实的折腾与复盘。
  socialIcons:
    - name: github
      url: "https://github.com/yutter2024"
    - name: email
      url: "mailto:xiaozb@xiaozb.online"
  label:
    text: "小张的 AI 笔记"
    icon: "/favicon.svg"
    iconHeight: 28

menu:
  main:
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 10
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 20
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 30
    - identifier: about
      name: 关于
      url: /about/
      weight: 40
    - identifier: search
      name: 搜索
      url: /search/
      weight: 50

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: monokai
    tabWidth: 4

permalinks:
  posts: /posts/:slug/

privacy:
  disqus:
    disable: true
  googleAnalytics:
    disable: true

enableRobotsTXT: true
