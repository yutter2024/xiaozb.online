baseURL: "https://yutterx.com/"
title: "Yutter的 AI 笔记"
description: "记录 AI、LLM、Agent 与个人折腾"
keywords:
  - AI
  - LLM
  - Agent
  - 大模型
author: "Yutter"
languageCode: "zh-cn"
defaultContentLanguage: "zh-cn"
hasCJKLanguage: true
theme: "PaperMod"

params:
  env: production
  description: "记录 AI、LLM、Agent 与个人折腾"
  author: "Yutter"
  DateFormat: "2006-01-02"
  defaultTheme: auto
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowToc: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowReadingTime: true
  ShowWordCount: false
  ShowRssButtonInSectionMenu: true
  ShowPageNums: true
  disableSpecial1stPost: true
  mainSections:
    - posts
  assets:
    favicon: "/favicon.ico"
  homeInfoParams:
    Title: "你好，我是Yutter 👋"
    Content: |
      这里是我的 AI 技术笔记。

      记录大模型、Agent、自动化工具，以及每一次真实的折腾与复盘。
  profileMode:
    enabled: true
    title: "你好，我是 Yutter 👋"
    subtitle: |
      AI 折腾者 · 工具控

      这里记录大模型、Agent、自动化工具的实测，
      以及每一次真实的折腾与避坑。
      想了解我写了什么，往下看 ↓
    imageUrl: "avatar.png"
    imageTitle: "Yutter"
    imageWidth: 128
    imageHeight: 128
    buttons:
      - name: 从这里开始
        url: /start/
      - name: 看我的实测教程
        url: /categories/建站教程/
  socialIcons:
    - name: github
      url: "https://github.com/yutter2024"
    - name: email
      url: "mailto:yutter@yutterx.com"
  label:
    text: "Yutter的 AI 笔记"
    icon: "/favicon.svg"
    iconHeight: 28

menu:
  main:
    - identifier: home
      name: 首页
      url: /
      weight: 5
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 10
    - identifier: categories
      name: 分类
      url: /categories/
      weight: 15
    - identifier: start
      name: 从这里开始
      url: /start/
      weight: 25
    - identifier: about
      name: 关于
      url: /about/
      weight: 40
    - identifier: search
      name: 搜索
      url: /search/
      weight: 50

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: monokai
    tabWidth: 4

permalinks:
  posts: /posts/:slug/

privacy:
  disqus:
    disable: true
  googleAnalytics:
    disable: true

enableRobotsTXT: true
